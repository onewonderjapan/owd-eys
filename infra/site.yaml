AWSTemplateFormatVersion: '2010-09-09'
Description: EYS noncommercial fan-work static playground, same private-S3 and CloudFront pattern as pet.onewonder.co.jp.
Parameters:
  PublishDns:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
Conditions:
  Publish: !Equals [!Ref PublishDns, 'true']
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: onewonder-eys-566601428909
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      Tags:
        - {Key: Project, Value: owd-eys}
        - {Key: Purpose, Value: noncommercial-fan-technical-demo}
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: onewonder-eys-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: true
        Comment: eys.onewonder.co.jp - noncommercial Goose Goose Duck fan playground
        Aliases: [eys.onewonder.co.jp]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: onewonder-eys-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginPath: /out
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: onewonder-eys-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 0c3a60d0-24cd-41ce-85c9-87bbe0717564
          ResponseHeadersPolicyId: a4818ae3-d1b4-4c61-b55c-ff98a459a672
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:566601428909:certificate/b3c65f6e-c447-4ddf-a17b-d11f2ade4cbd
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Restrictions:
          GeoRestriction: {RestrictionType: none}
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OnlyEysCloudFrontReadsPublishedFiles
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/out/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  SiteRecord:
    Type: AWS::Route53::RecordSet
    Condition: Publish
    Properties:
      HostedZoneId: Z049829035FWZ7KYTMXD4
      Name: eys.onewonder.co.jp.
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false
Outputs:
  Bucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: https://eys.onewonder.co.jp/
