AWSTemplateFormatVersion: '2010-09-09'
Description: EYS noncommercial fan-work static playground - private S3 origin behind CloudFront (OAC), optional Route 53 alias.

# Template shipped with the repository. Every account-specific identifier is a
# parameter, so no bucket name, certificate ARN or hosted zone id is committed.
# Supply the real values at deploy time, e.g. from a local .env (see .env.example):
#
#   aws cloudformation deploy \
#     --profile "$EYS_AWS_PROFILE" --region ap-northeast-1 \
#     --stack-name owd-eys --template-file infra/site.example.yaml \
#     --parameter-overrides \
#       SiteDomainName="$EYS_SITE_DOMAIN" \
#       SiteBucketName="$EYS_S3_BUCKET" \
#       AcmCertificateArn="$EYS_ACM_CERT_ARN" \
#       HostedZoneId="$EYS_HOSTED_ZONE_ID" \
#       CachePolicyId="$EYS_CF_CACHE_POLICY_ID" \
#       ResponseHeadersPolicyId="$EYS_CF_RESPONSE_HEADERS_POLICY_ID" \
#       PublishDns=false
#
# Keep any copy that has real values baked in as infra/site.local.yaml - that
# name is gitignored.
Parameters:
  SiteDomainName:
    Type: String
    Description: Public host name served by the distribution, e.g. eys.example.com
  SiteBucketName:
    Type: String
    Description: Private S3 bucket holding the published build under the out/ prefix
  AcmCertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 covering SiteDomainName
    AllowedPattern: '^arn:aws[a-zA-Z-]*:acm:us-east-1:\d{12}:certificate/.+$'
  HostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 hosted zone id for SiteDomainName; required only when PublishDns=true
  CachePolicyId:
    Type: String
    Default: 658327ea-f89d-4fab-a63d-7e88639e58f6
    Description: >-
      CloudFront cache policy. Default is the AWS managed CachingOptimized policy;
      override with your own policy id if the site reuses a shared custom policy.
  ResponseHeadersPolicyId:
    Type: String
    Default: 67f7725c-6f97-4210-82d7-5512b31e9d03
    Description: >-
      CloudFront response headers policy. Default is the AWS managed SecurityHeadersPolicy;
      override with your own policy id if the site reuses a shared custom policy.
  PublishDns:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
Conditions:
  Publish: !Equals [!Ref PublishDns, 'true']
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref SiteBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      Tags:
        - {Key: Project, Value: owd-eys}
        - {Key: Purpose, Value: noncommercial-fan-technical-demo}
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: true
        Comment: !Sub '${SiteDomainName} - noncommercial Goose Goose Duck fan playground'
        Aliases: [!Ref SiteDomainName]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site-s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginPath: /out
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: site-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref CachePolicyId
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicyId
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Restrictions:
          GeoRestriction: {RestrictionType: none}
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OnlyThisCloudFrontReadsPublishedFiles
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/out/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  SiteRecord:
    Type: AWS::Route53::RecordSet
    Condition: Publish
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${SiteDomainName}.'
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        # Fixed CloudFront alias zone id, identical in every account.
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false
Outputs:
  Bucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: !Sub 'https://${SiteDomainName}/'
